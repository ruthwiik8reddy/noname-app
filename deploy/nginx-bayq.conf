# nginx site for BayQ. Replace bayq.example.com with your domain, then:
#   sudo cp deploy/nginx-bayq.conf /etc/nginx/sites-available/bayq
#   sudo ln -s /etc/nginx/sites-available/bayq /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d bayq.example.com      # free HTTPS certificate
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name bayq.example.com;
    # certbot answers its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name bayq.example.com;

    # Filled in by certbot:
    # ssl_certificate     /etc/letsencrypt/live/bayq.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bayq.example.com/privkey.pem;

    server_tokens off;
    client_max_body_size 16m;            # matches the app's upload limit

    # Static files straight from disk (customer photos are NOT in here).
    location /static/ {
        alias /opt/bayq/static/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }

    # Old photo links point here; the app checks the viewer may see them.
    location /static/uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # AI requests (vision especially) can take a few minutes.
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }

    # Slow down password guessing before it reaches the app.
    location = /login {
        limit_req zone=bayq_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# Must be at http{} level — nginx includes sites-enabled inside http{}.
limit_req_zone $binary_remote_addr zone=bayq_login:10m rate=10r/m;
