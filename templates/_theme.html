{# ── Shared page chrome for the Phase 1-3 screens ──────────────────────────
   Single source of truth for the dark/gold system already used by jobs.html
   and dashboard.html. Include inside <head>, after the font link. #}
<style>
  :root {
    --bg:        #0D0D0D;
    --surface:   rgba(255,255,255,0.02);
    --line:      rgba(255,255,255,0.07);
    --line-soft: rgba(255,255,255,0.04);
    --ink:       #E8E6E0;
    --ink-dim:   rgba(255,255,255,0.4);
    --ink-faint: rgba(255,255,255,0.25);
    --gold:      #C8A96E;
    --green:     #4ADE80;
    --amber:     #E0A458;
    --red:       #E5484D;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    -webkit-font-smoothing: antialiased;
  }

  .main { flex: 1; padding: 44px 48px; overflow-y: auto; }

  .top-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 32px; }
  .page-heading { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: .1em; color: var(--gold); }
  .page-sub { font-size: 12px; color: rgba(255,255,255,0.3); margin-top: 4px; max-width: 62ch; line-height: 1.5; }

  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    color: rgba(255,255,255,0.3); margin: 36px 0 12px;
    padding-bottom: 8px; border-bottom: 1px solid var(--line-soft);
  }

  /* ── buttons ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; border: 1px solid rgba(200,169,110,0.3); color: var(--gold);
    padding: 8px 16px; border-radius: 5px; font-size: 12px; font-family: inherit;
    cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s;
  }
  .btn:hover { background: rgba(200,169,110,0.1); border-color: rgba(200,169,110,0.55); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-solid { background: var(--gold); border-color: var(--gold); color: #121212; font-weight: 600; }
  .btn-solid:hover { background: #d8bb80; }
  .btn-quiet { border-color: var(--line); color: var(--ink-dim); }
  .btn-quiet:hover { background: rgba(255,255,255,0.05); color: var(--ink); }
  .btn-sm { padding: 5px 11px; font-size: 11px; }
  .btn:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, button:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 2px;
  }

  /* ── cards & tables ── */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px; }
  .card-flush { padding: 0; overflow: hidden; }

  .metric-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .metric { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; }
  .metric-label { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,0.3); }
  .metric-value { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: .04em; margin-top: 6px; color: var(--ink); line-height: 1; }
  .metric-value.gold { color: var(--gold); }
  .metric-value.red { color: var(--red); }
  .metric-value.green { color: var(--green); }
  .metric-note { font-size: 11px; color: var(--ink-faint); margin-top: 6px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    padding: 12px 16px; text-align: left; font-size: 11px; font-weight: 500;
    letter-spacing: .07em; text-transform: uppercase; color: rgba(255,255,255,0.3);
    border-bottom: 1px solid var(--line);
  }
  tbody tr { border-bottom: 1px solid var(--line-soft); }
  tbody tr:last-child { border-bottom: none; }
  td { padding: 13px 16px; vertical-align: middle; }

  /* ── badges ── */
  .badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
    border-radius: 20px; font-size: 11px; font-weight: 500; white-space: nowrap;
  }
  .badge .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .badge-critical { background: rgba(229,72,77,0.14);  color: var(--red); }
  .badge-warning  { background: rgba(224,164,88,0.14); color: var(--amber); }
  .badge-ok       { background: rgba(74,222,128,0.12); color: var(--green); }
  .badge-idle     { background: rgba(255,255,255,0.06); color: var(--ink-dim); }
  .badge-gold     { background: rgba(200,169,110,0.15); color: var(--gold); }
  .badge-pending   { background: rgba(255,255,255,0.07); color: var(--ink-dim); }
  .badge-progress  { background: rgba(200,169,110,0.15); color: var(--gold); }
  .badge-completed { background: rgba(74,222,128,0.12); color: var(--green); }

  /* ── forms ── */
  select, input[type=text], input[type=number], textarea {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: var(--ink); border-radius: 4px; padding: 8px 10px;
    font-size: 12px; font-family: inherit;
  }
  select option { background: #1A1A1A; }
  label.field { display: block; font-size: 11px; color: var(--ink-dim); margin-bottom: 5px; }

  /* ── status strip: honest about whether the local model answered ── */
  .ai-strip {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 11px; color: var(--ink-faint); margin-top: 10px;
  }
  .ai-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .ai-dot.off { background: var(--amber); }

  .empty { padding: 56px 24px; text-align: center; color: rgba(255,255,255,0.2); font-size: 13px; }
  .empty strong { display: block; color: var(--ink-dim); font-size: 14px; margin-bottom: 6px; }

  .muted { color: var(--ink-faint); }
  .hint { font-size: 11px; color: rgba(255,255,255,0.2); margin-top: 14px; line-height: 1.6; }

  .spinner {
    width: 13px; height: 13px; border: 2px solid rgba(200,169,110,0.25);
    border-top-color: var(--gold); border-radius: 50%;
    animation: spin .7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  @media (max-width: 900px) {
    body { flex-direction: column; }
    .main { padding: 28px 20px; }
    .sidebar { width: 100%; }
  }
</style>
