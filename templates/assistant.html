<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant — Autofiera</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #0D0D0D; color: #E8E6E0; min-height: 100vh; padding: 24px; }
    .container { max-width: 900px; margin: 0 auto; }
    .brand { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: .14em; color: #C8A96E; margin-bottom: 12px; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 28px; box-shadow: 0 32px 80px rgba(0,0,0,0.3); }
    label { display: block; margin-bottom: 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: rgba(255,255,255,0.55); }
    textarea, input { width: 100%; border-radius: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #E8E6E0; font-size: 15px; padding: 14px; resize: vertical; }
    textarea { min-height: 160px; }
    button { padding: 14px 18px; border: none; border-radius: 8px; background: #C8A96E; color: #0D0D0D; font-family: 'Bebas Neue', sans-serif; font-size: 16px; cursor: pointer; margin-top: 14px; }
    button:disabled { opacity: .7; cursor: not-allowed; }
    .response { margin-top: 24px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 24px; }
    .section { margin-bottom: 18px; }
    .section h3 { margin-bottom: 10px; color: #C8A96E; }
    .box { background: rgba(255,255,255,0.05); padding: 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); white-space: pre-wrap; line-height: 1.6; }
    .hint { margin-top: 18px; font-size: 13px; color: rgba(255,255,255,0.6); }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">AUTOFIERA AI ASSISTANT</div>
    <div class="card">
      <div class="section">
        <label for="question">Ask your assistant</label>
        <textarea id="question" placeholder="Ask about brake pads, customer jobs, a photo, or how to compare worn parts..."></textarea>
      </div>
      <div class="section">
        <label for="attachments">Attachments (optional, comma-separated URLs or paths)</label>
        <input id="attachments" placeholder="e.g. /uploads/brake1.jpg, /uploads/brake2.mp4" />
      </div>
      <button id="submit">Send to AI</button>
      <div class="hint">Note: this page will route your question through the configured AI backend. If no API keys are set, it returns a local fallback message.</div>
      <div class="response" id="result" style="display:none;">
        <div class="section"><h3>Answer</h3><div class="box" id="answer"></div></div>
        <div class="section"><h3>Reasoning</h3><div class="box" id="reasoning"></div></div>
        <div class="section"><h3>Sources</h3><div class="box" id="sources"></div></div>
        <div class="section"><h3>Evidence</h3><div class="box" id="evidence"></div></div>
      </div>
    </div>
  </div>
  <script>
    const submit = document.getElementById('submit');
    const result = document.getElementById('result');
    const answerBox = document.getElementById('answer');
    const reasoningBox = document.getElementById('reasoning');
    const sourcesBox = document.getElementById('sources');
    const evidenceBox = document.getElementById('evidence');

    submit.addEventListener('click', async () => {
      const question = document.getElementById('question').value.trim();
      const attachmentsText = document.getElementById('attachments').value.trim();
      const attachments = attachmentsText ? attachmentsText.split(',').map(item => item.trim()).filter(Boolean) : [];
      if (!question) {
        alert('Please enter a question.');
        return;
      }
      submit.disabled = true;
      submit.textContent = 'Thinking...';
      try {
        const response = await fetch('/assistant/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, attachments }),
        });
        const data = await response.json();
        answerBox.textContent = data.answer || data.error || '';
        reasoningBox.textContent = data.reasoning || '';
        sourcesBox.textContent = (data.sources || []).join('\n');
        evidenceBox.textContent = JSON.stringify(data.evidence || [], null, 2);
        result.style.display = 'block';
      } catch (err) {
        alert('AI request failed: ' + err);
      } finally {
        submit.disabled = false;
        submit.textContent = 'Send to AI';
      }
    });
  </script>
</body>
</html>
