{% extends "_base.html" %}
{% block title %}Add Staff — {{ studio }}{% endblock %}

{% block content %}
<h1 class="page-title">Add Staff Member</h1>
  <p class="page-sub">Create a login for a new team member</p>

  {% if errors %}
  <div class="errors">{% for e in errors %}<p>{{ e }}</p>{% endfor %}</div>
  {% endif %}

  <form method="POST">
    <div class="form-grid">
      <div>
        <label>Full Name</label>
        <input type="text" name="name" placeholder="Maria Lopez" required>
      </div>

      <div>
        <label>Role</label>
        <div class="role-cards">
          {% for r in roles %}
          <label class="role-card" onclick="document.querySelectorAll('.role-card').forEach(c=>c.classList.remove('selected')); this.classList.add('selected')">
            <input type="radio" name="role" value="{{ r }}" required>
            <div class="role-name">{{ role_labels[r] }}</div>
            <div class="role-desc">
              {% if r == 'general_manager' %}Full access, can't manage staff
              {% elif r == 'service_advisor' %}Bookings, estimates, payments
              {% elif r == 'technician' %}Assigned jobs, media upload
              {% elif r == 'photographer' %}Media gallery only
              {% endif %}
            </div>
          </label>
          {% endfor %}
        </div>
      </div>

      <div>
        <label>Username</label>
        <input type="text" name="username" placeholder="maria" required>
      </div>

      <div>
        <label>Password</label>
        <input type="password" name="password" placeholder="Min 8 chars, upper, lower, number, symbol" required>
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="btn-submit">Create Staff Login</button>
      <a href="/staff" class="btn-cancel">Cancel</a>
    </div>
  </form>
{% endblock %}
