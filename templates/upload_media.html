<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Media — {{ studio }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'DM Sans',sans-serif; background:#0D0D0D; color:#E8E6E0; min-height:100vh; display:flex; }
    .sidebar { width:220px; flex-shrink:0; border-right:1px solid rgba(255,255,255,0.07); display:flex; flex-direction:column; }
    .logo-area { padding:28px 24px; border-bottom:1px solid rgba(255,255,255,0.07); }
    .studio-logo { width:140px; height:52px; object-fit:contain; object-position:left; display:block; margin-bottom:8px; }
    .studio-name-fallback { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:.1em; color:#C8A96E; display:none; margin-bottom:6px; }
    .studio-city { font-size:11px; color:rgba(255,255,255,0.3); }
    .studio-owner { font-size:11px; color:rgba(255,255,255,0.2); margin-top:3px; }
    nav { flex:1; padding:20px 12px; }
    nav a { display:block; padding:10px 12px; font-size:13px; color:rgba(255,255,255,0.4); text-decoration:none; border-radius:4px; margin-bottom:2px; }
    nav a:hover  { color:#E8E6E0; background:rgba(255,255,255,0.05); }
    nav a.active { color:#C8A96E; background:rgba(200,169,110,0.1); }
    .logout-area { padding:16px 24px; border-top:1px solid rgba(255,255,255,0.07); }
    .logout-area a { font-size:12px; color:rgba(255,255,255,0.25); text-decoration:none; }
    .main { flex:1; padding:44px 48px; overflow-y:auto; }
    .page-heading { font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:.1em; color:#C8A96E; margin-bottom:4px; }
    .page-sub { font-size:13px; color:rgba(255,255,255,0.3); margin-bottom:32px; }
    .errors { background:rgba(248,113,113,0.08); border:1px solid rgba(248,113,113,0.3); border-radius:4px; padding:14px 18px; margin-bottom:24px; max-width:480px; }
    .errors p { font-size:13px; color:#F87171; margin-bottom:4px; }
    .form-grid { display:flex; flex-direction:column; gap:18px; max-width:480px; }
    label { font-size:11px; font-weight:500; letter-spacing:.07em; text-transform:uppercase; color:rgba(255,255,255,0.4); display:block; margin-bottom:7px; }
    input, select, textarea { width:100%; padding:11px 14px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:4px; color:#E8E6E0; font-family:'DM Sans',sans-serif; font-size:13px; outline:none; }
    select option { background:#1A1A1A; }
    .stage-cards { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
    .stage-card { padding:14px; text-align:center; border:1px solid rgba(255,255,255,0.1); border-radius:4px; cursor:pointer; position:relative; }
    .stage-card input { position:absolute; opacity:0; }
    .stage-card:hover { border-color:rgba(200,169,110,0.5); }
    .stage-card.selected { background:rgba(200,169,110,0.1); border-color:#C8A96E; }
    .file-drop { border:2px dashed rgba(255,255,255,0.15); border-radius:6px; padding:36px 20px; text-align:center; cursor:pointer; transition:border-color .2s; }
    .file-drop:hover { border-color:#C8A96E; }
    .file-drop input { display:none; }
    .file-list { margin-top:10px; font-size:12px; color:rgba(255,255,255,0.4); }
    .actions { display:flex; gap:14px; margin-top:8px; }
    .btn-submit { padding:12px 32px; background:#C8A96E; color:#0D0D0D; border:none; border-radius:4px; font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:.08em; cursor:pointer; }
    .btn-cancel { font-size:13px; color:rgba(255,255,255,0.3); text-decoration:none; align-self:center; }
  </style>
</head>
<body>
<aside class="sidebar">
  <div class="logo-area">
    <img src="/static/logos/{{ logo }}" alt="{{ studio }}" class="studio-logo"
         onerror="this.style.display='none';document.getElementById('nf').style.display='block'">
    <span id="nf" class="studio-name-fallback">{{ studio }}</span>
    <span class="studio-city">{{ city }}</span>
    <span class="studio-owner">{{ owner }}</span>
  </div>
  <nav>
    <a href="/dashboard">Dashboard</a>
    <a href="/media" class="active">Media</a>
    <a href="/assistant">AI Assistant</a>
  </nav>
  <div class="logout-area"><a href="/logout">← Sign out</a></div>
</aside>
<main class="main">
  <h1 class="page-heading">Upload Media</h1>
  <p class="page-sub">Add before / during / after photos for a job</p>

  {% if errors %}
  <div class="errors">{% for e in errors %}<p>{{ e }}</p>{% endfor %}</div>
  {% endif %}

  <form method="POST" enctype="multipart/form-data">
    <div class="form-grid">
      <div>
        <label>Job (optional)</label>
        <select name="job_id">
          <option value="">— No specific job —</option>
          {% for j in jobs %}
          <option value="{{ j.id }}">#{{ j.id }} — {{ j.car }} ({{ j.service }})</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label>Stage</label>
        <div class="stage-cards">
          <label class="stage-card selected" onclick="selectStage(this)">
            <input type="radio" name="stage" value="before" checked>Before
          </label>
          <label class="stage-card" onclick="selectStage(this)">
            <input type="radio" name="stage" value="during">During
          </label>
          <label class="stage-card" onclick="selectStage(this)">
            <input type="radio" name="stage" value="after">After
          </label>
        </div>
      </div>

      <div>
        <label>Photos / Videos</label>
        <div class="file-drop" onclick="document.getElementById('fileInput').click()">
          <div>Click to choose files</div>
          <div style="font-size:11px;opacity:.4;margin-top:6px;">Images and videos supported</div>
          <input type="file" id="fileInput" name="files" multiple accept="image/*,video/*" onchange="showFiles(this)">
        </div>
        <div class="file-list" id="fileList"></div>
      </div>

      <div>
        <label>Caption (optional)</label>
        <textarea name="caption" rows="2" placeholder="Notes about these photos..."></textarea>
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="btn-submit">Upload</button>
      <a href="/media" class="btn-cancel">Cancel</a>
    </div>
  </form>
</main>
<script>
function selectStage(el) {
  document.querySelectorAll('.stage-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
}
function showFiles(input) {
  const list = document.getElementById('fileList');
  list.textContent = input.files.length + ' file(s) selected: ' +
    Array.from(input.files).map(f => f.name).join(', ');
}
</script>
</body>
</html>
