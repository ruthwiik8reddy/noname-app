{% extends "_base.html" %}
{% block title %}Add Customer — {{ studio }}{% endblock %}

{% block content %}
<h1 class="page-title">Add Customer</h1>
  <p class="page-sub">Create a customer profile, optionally with their first vehicle</p>

  {% if errors %}
  <div class="errors">{% for e in errors %}<p>{{ e }}</p>{% endfor %}</div>
  {% endif %}

  <form method="POST">
    <div class="form-grid">
      <div>
        <label>Full Name *</label>
        <input type="text" name="name" placeholder="John Smith" required>
      </div>
      <div>
        <label>Phone *</label>
        <input type="text" name="phone" placeholder="+1 (555) 000-0000" required>
      </div>
      <div>
        <label>Email</label>
        <input type="email" name="email" placeholder="john@email.com">
      </div>
      <div>
        <label>Notes</label>
        <textarea name="notes" placeholder="Any notes about this customer..."></textarea>
      </div>

      <div class="section-divider">Vehicle (optional)</div>
      <div>
        <label>Make / Model</label>
        <input type="text" name="vehicle_make_model" placeholder="2023 BMW M4 Competition">
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="btn-submit">Save Customer</button>
      <a href="/customers" class="btn-cancel">Cancel</a>
    </div>
  </form>
{% endblock %}
