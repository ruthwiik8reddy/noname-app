<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Autofiera</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #0D0D0D;
      color: #E8E6E0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 400px;
      padding: 48px 40px 40px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
    }
    .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: .14em;
      color: #C8A96E;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.35);
      margin-bottom: 36px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 7px;
    }
    input {
      width: 100%;
      padding: 11px 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      color: #E8E6E0;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      margin-bottom: 18px;
      transition: border-color .2s;
    }
    input:focus { border-color: #C8A96E; }
    .error {
      background: rgba(220,50,50,0.1);
      border: 1px solid rgba(220,50,50,0.3);
      color: #F87171;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 18px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #C8A96E;
      color: #0D0D0D;
      border: none;
      border-radius: 4px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: .1em;
      cursor: pointer;
      transition: opacity .2s;
    }
    button:hover { opacity: .85; }
    .hint {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.07);
      font-size: 12px;
      color: rgba(255,255,255,0.25);
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">AUTOFIERA</div>
    <p class="subtitle">Detailing Studio Platform — Sign in to continue</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter your username" autofocus>

      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••">

      <button type="submit">Sign In</button>
    </form>

    <div class="hint">
      Test logins:<br>
      <strong>shinepro</strong> / shine123 &nbsp;·&nbsp;
      <strong>apexdetail</strong> / apex123 &nbsp;·&nbsp;
      <strong>velvetauto</strong> / velvet123
    </div>
  </div>
</body>
</html>
