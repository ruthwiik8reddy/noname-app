<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — BayQ</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 400px;
      padding: 48px 40px 40px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }

    /* Logo image replaces text brand */
    .logo-wrap {
      margin-bottom: 12px;
      text-align: center;
    }
    .logo-wrap img {
      height: 160px;
      width: auto;
      display: inline-block;
    }

    .subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 36px;
      text-align: center;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      color: #1a1a1a;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      margin-bottom: 18px;
      transition: border-color .2s;
    }
    input:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,0.08); }

    .error {
      background: rgba(239,68,68,0.06);
      border: 1px solid rgba(239,68,68,0.25);
      color: #dc2626;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #7c3aed;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .02em;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #6d28d9; }

    .hint {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #f3f4f6;
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.8;
    }
    .hint strong { color: #374151; }
  </style>
</head>
<body>
  <div class="card">

    <!-- Logo — replace bayq_logo.png with your file in static/logos/ -->
    <div class="logo-wrap">
      <img src="/static/logos/bayq_logo.png" alt="BayQ"
           onerror="this.style.display='none'; document.getElementById('fallback').style.display='block'">
      <span id="fallback" style="display:none; font-size:28px; font-weight:800; color:#7c3aed; letter-spacing:-.01em;">
        Bay<span style="color:#1a1a1a;">Q</span>
      </span>
    </div>

    <p class="subtitle">   Detailing Studio Management Platform — Sign in to continue</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter your username" autofocus>

      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••">

      <button type="submit">Sign In</button>
    </form>

    <div class="hint">
      Test logins:<br>
      <strong>shinepro</strong> / shine123 &nbsp;·&nbsp;
      <strong>apexdetail</strong> / apex123 &nbsp;·&nbsp;
      <strong>velvetauto</strong> / velvet123
    </div>
  </div>
</body>
</html>
