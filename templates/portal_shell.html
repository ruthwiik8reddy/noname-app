<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Your vehicle portal{% endblock %}</title><style>body{margin:0;font:16px/1.6 system-ui;color:#16343f;background:#f3f6f7}main{max-width:1000px;margin:auto;padding:24px}section{background:white;padding:24px;margin:20px 0;border:1px solid #dbe4e7;border-radius:12px}a{color:#006f78}nav{display:flex;gap:20px}input,textarea,button{font:inherit;padding:10px;max-width:100%;box-sizing:border-box}label{display:block;margin:12px 0}textarea{width:100%}button{cursor:pointer}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}.scroll{overflow:auto}.terms{white-space:pre-wrap}img,video{max-width:100%}</style></head><body><main><nav><a href="/portal/">Your vehicles</a><a href="/logout">Sign out</a></nav>{% for category,message in get_flashed_messages(with_categories=true) %}<p role="status">{{message}}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
