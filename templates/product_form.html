<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ 'Edit' if product else 'New' }} Product — Autofiera</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#0D0D0D;color:#E8E6E0;min-height:100vh;display:flex}
.main{flex:1;padding:44px 48px;max-width:820px}
.back{font-size:12px;color:rgba(255,255,255,0.3);text-decoration:none}
.page-heading{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.1em;color:#C8A96E;margin:8px 0 4px}
.page-sub{font-size:13px;color:rgba(255,255,255,0.3);margin-bottom:28px}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:26px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:700px){.row,.row3{grid-template-columns:1fr}}
label{font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,0.4);display:block;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 13px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:5px;color:#E8E6E0;font-family:'DM Sans',sans-serif;font-size:14px}
select option{background:#1A1A1A}
textarea{min-height:70px;resize:vertical}
.calc{background:rgba(200,169,110,0.06);border:1px solid rgba(200,169,110,0.2);border-radius:8px;padding:14px 16px;margin:18px 0;font-size:13px;line-height:1.7}
.calc b{color:#C8A96E}
.btn-gold{background:#C8A96E;color:#0D0D0D;padding:13px 32px;border-radius:6px;font-family:'Bebas Neue',sans-serif;letter-spacing:.06em;font-size:17px;border:none;cursor:pointer}
</style>
</head>
<body>
{% include "_sidebar.html" %}
<main class="main">
  <a href="/products" class="back">← Back to Products</a>
  <h1 class="page-heading">{{ 'Edit' if product else 'New' }} Product</h1>
  <p class="page-sub">Pricing entered here is what the AI estimator uses to quote jobs.</p>

  <form method="POST" class="card">
    <div class="row">
      <div>
        <label>Product Name *</label>
        <input type="text" name="name" required value="{{ product.name if product else '' }}"
               placeholder="e.g. XPEL Ultimate Plus">
      </div>
      <div>
        <label>Category</label>
        <select name="category">
          {% for c in categories %}
          <option value="{{ c }}" {% if product and product.category == c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Brand</label>
        <input type="text" name="brand" value="{{ product.brand if product else '' }}" placeholder="e.g. XPEL, Gtechniq">
      </div>
      <div>
        <label>Warranty (years)</label>
        <input type="number" name="warranty_years" min="0" value="{{ product.warranty_years if product else 0 }}">
      </div>
    </div>

    <div class="row3">
      <div>
        <label>Material cost / sqft *</label>
        <input type="number" step="0.01" min="0" name="cost_per_sqft" id="mat" required
               value="{{ product.cost_per_sqft if product else '' }}" placeholder="6.50">
      </div>
      <div>
        <label>Labour cost / sqft</label>
        <input type="number" step="0.01" min="0" name="labour_per_sqft" id="lab"
               value="{{ product.labour_per_sqft if product else 0 }}" placeholder="4.00">
      </div>
      <div>
        <label>Markup %</label>
        <input type="number" step="1" min="0" name="markup_percent" id="mk"
               value="{{ product.markup_percent if product else 0 }}" placeholder="35">
      </div>
    </div>

    <div class="calc" id="calc">
      Example on a <b>200 sqft</b> vehicle: <span id="ex">—</span>
    </div>

    <div style="margin-bottom:18px">
      <label>Notes</label>
      <textarea name="notes" placeholder="Anything staff should know about this product">{{ product.notes if product else '' }}</textarea>
    </div>

    <button type="submit" class="btn-gold">{{ 'Save Changes' if product else 'Add Product' }}</button>
  </form>
</main>
<script>
function upd(){
  const m=parseFloat(document.getElementById('mat').value||0);
  const l=parseFloat(document.getElementById('lab').value||0);
  const k=parseFloat(document.getElementById('mk').value||0);
  const area=200, base=(m+l)*area, mk=base*k/100, tot=base+mk;
  document.getElementById('ex').innerHTML =
    `material <b>$${(m*area).toFixed(0)}</b> + labour <b>$${(l*area).toFixed(0)}</b> + margin <b>$${mk.toFixed(0)}</b> = <b>$${tot.toFixed(0)}</b>`;
}
['mat','lab','mk'].forEach(id=>document.getElementById(id).addEventListener('input',upd));
upd();
</script>
</body>
</html>
